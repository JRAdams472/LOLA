name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel stale runs on the same ref — only the latest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets — gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: gitleaks
        # Docker image run — no license key required (unlike the action).
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks:latest
          detect --source /repo --redact --verbose

  dotnet:
    name: .NET — format / build / test
    runs-on: ubuntu-latest
    # MPEx's store — the live eval backend for the never-skip
    # MpexLiveTests round-trip (mirrors MPEx's own CI e2e job).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mpex
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: mpex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpex -d mpex"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: dotnet format
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        run: dotnet format --verify-no-changes
      - name: dotnet build
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        run: dotnet build -c Release
      - name: Start OpenBao (dev mode — ephemeral test backend)
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        # Detached container, same pattern as the SonarQube job. Dev mode
        # is correct here: ephemeral test infra, root token only, no data.
        # Lola.Infrastructure.Tests hard-requires a real transit engine.
        run: |
          docker run -d --name openbao -p 8200:8200 \
            openbao/openbao:latest \
            server -dev -dev-root-token-id=devroot -dev-listen-address=0.0.0.0:8200
          for i in $(seq 1 30); do
            curl -sf http://localhost:8200/v1/sys/seal-status >/dev/null && exit 0
            sleep 1
          done
          echo "openbao did not come up"; docker logs openbao --tail 30; exit 1
      - name: Checkout MPEx (live eval backend)
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: JRAdams472/MPEx
          path: mpex-srv
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        with:
          workspaces: mpex-srv
      - name: Build MPEx + start Dex & api
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        # Same recipe as MPEx's own CI e2e job: generated Dex secrets,
        # seeded binary, draft artifacts. Lola.Infrastructure.Tests
        # MpexLive* hard-requires this stack (never-skip).
        run: |
          cargo build --manifest-path mpex-srv/Cargo.toml
          SVC_SECRET=$(openssl rand -hex 16)
          CI_SECRET=$(openssl rand -hex 16)
          echo "MPEX_CLIENT_SECRET=$SVC_SECRET" >> "$GITHUB_ENV"
          echo "MPEX_SEED_CLIENT_SECRET=$CI_SECRET" >> "$GITHUB_ENV"
          docker run -d --name dex -p 5556:5556 \
            -v "$PWD/mpex-srv/dex/config.dev.yaml:/etc/dex/config.yaml" \
            -e "DEX_MPEX_SVC_SECRET=$SVC_SECRET" \
            -e "DEX_MPEX_CI_SECRET=$CI_SECRET" \
            dexidp/dex:v2.46.0 dex serve /etc/dex/config.yaml
          for i in $(seq 1 30); do
            curl -sf http://localhost:5556/dex/.well-known/openid-configuration >/dev/null && break
            sleep 1
          done
          DATABASE_URL="postgres://mpex:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/mpex" \
          RUN_SEED=1 SEED_DIR="$PWD/mpex-srv/seed" \
          OIDC_ISSUER=http://localhost:5556/dex \
          OIDC_AUDIENCE=mpex-api,mpex-web,mpex-svc,mpex-ci \
          ./mpex-srv/target/debug/mpex &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz && exit 0 || sleep 1
          done
          echo "mpex did not come up"; exit 1
      - name: dotnet test (coverage)
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        env:
          OPENBAO_ADDR: http://localhost:8200
          OPENBAO_TOKEN: devroot
          MPEX_BASE_URL: http://localhost:8080
          MPEX_TOKEN_URL: http://localhost:5556/dex/token
          MPEX_CLIENT_ID: mpex-svc
          MPEX_SEED_CLIENT_ID: mpex-ci
        run: >
          dotnet test -c Release --collect:"XPlat Code Coverage" --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=lcov
      - name: coverage floor (80%/area)
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        run: |
          mapfile -t files < <(find . -name "coverage.info" -o -name "*.lcov.info" | sort)
          node tools/covercheck.mjs "${files[@]}"

  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          # npm cache + cache-dependency-path added when clients/web lands (M10)
      - name: lint / typecheck / test / build
        if: ${{ hashFiles('clients/web/package.json') != '' }}
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

  sonarqube:
    name: SonarQube — scan + quality gate
    needs: [dotnet, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # blame + new-code detection need history
      - name: Start SonarQube
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community
          for i in $(seq 1 90); do
            s=$(curl -sf http://localhost:9000/api/system/status | grep -o '"status":"[A-Z_]*"' | cut -d'"' -f4 || true)
            [ "$s" = "UP" ] && exit 0
            [ "$s" = "DOWN" -o "$s" = "DB_MIGRATION_NEEDED" ] && { docker logs sonarqube --tail 50; exit 1; }
            sleep 4
          done
          docker logs sonarqube --tail 80; exit 1
      - name: Scanner token + scan + quality gate
        if: ${{ hashFiles('**/*.slnx', '**/*.sln') != '' }}
        env:
          # Default admin cred for the ephemeral in-CI SonarQube instance only.
          SONAR_ADMIN_CRED: admin:admin
        run: |
          token=$(curl -sf -u "$SONAR_ADMIN_CRED" \
            -X POST http://localhost:9000/api/user_tokens/generate?name=ci \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          [ -n "$token" ] || { echo "token generation failed"; exit 1; }
          docker run --rm --network host \
            -e SONAR_TOKEN=$token \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli
