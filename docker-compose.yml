# LOLA dev stack — api/web services land with M1/M10/M11.
services:
  openbao:
    # Secret/key management: transit engine (field-level PII encryption,
    # per-tenant DEKs) + KV (vendor creds). FILE BACKEND — survives
    # `compose down`; openbao-init auto-unseals on start. Dev uses a
    # 1-of-1 unseal share persisted to gitignored data/openbao/ —
    # sealed-state ops (Shamir) are a runbook concern for real
    # deployments: docs/openbao-runbook.md.
    image: openbao/openbao:latest
    command: server # entrypoint already passes -config=/openbao/config
    ports: ["8300:8200"] # host :8300 — api will take :8200
    volumes:
      - ./openbao/config:/openbao/config:ro
      - openbao-data:/openbao/file
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://localhost:8200 -format=json | grep -q '\"sealed\":false' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  openbao-init:
    # One-shot bootstrap: init → unseal → mount lola-transit → policy →
    # scoped api token. Idempotent; secrets land in gitignored
    # ./data/openbao (mounted read-only into api; also readable on the
    # host for `dotnet run` / local tests).
    image: openbao/openbao:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./openbao/init.sh:/init.sh:ro
      - ./data/openbao:/out
    depends_on:
      openbao:
        condition: service_started

  minio:
    # Borrower document vault (M10). Community source-build continuation —
    # dev-only S3 stand-in.
    image: ghcr.io/coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9200:9000", "9201:9001"] # host :9200/:9201 — ISPPr uses 9100/9101
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6

  clamav:
    # Upload scanning for the document vault (M10): quarantine → scan → clean.
    image: clamav/clamav:stable
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc localhost 3310 | grep -q PONG || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  # Observability — same convention as MPEx/ISPPr: traces → Jaeger
  # (OTLP/gRPC :4317, UI :16686), structured logs → Seq (OTLP/HTTP :5341).
  # The api exports only when OTEL_* env vars are set — exporter-free
  # otherwise. PII NEVER enters logs/spans (invariant 3).
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # host :17686 — :16686 is claimed by a concurrently running ISPPr/MPEx
    # stack; LOLA must coexist with them for integration work.
    # OTLP :14317 on host for local `dotnet run` (container net uses 4317).
    ports: ["17686:16686", "14317:4317"]

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # dev stack — no Seq login
    ports: ["5441:80"] # host :5441 — :5341 claimed by sibling stacks

  api:
    build: .
    ports: ["8200:8200"]
    environment:
      CORS_ORIGIN: http://localhost:3200
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN_FILE: /run/openbao/api-token
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CLAMAV_ADDR: clamav:3310
      VAULT_ADAPTER: minio
      CONTROL_DB_PATH: /app/data/control.db
      SEQ_URL: http://seq
      OTEL_SERVICE_NAME: lola
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      # Dev seed (MPE-208): first human users — absent in real deployments.
      DEV_SEED_TENANT: demo
      DEV_SEED_ADMIN_EMAIL: admin@lola.dev
      DEV_SEED_ADMIN_PASSWORD: lola-admin-dev
      DEV_SEED_OFFICER_EMAIL: officer@lola.dev
      DEV_SEED_OFFICER_PASSWORD: lola-officer-dev
    volumes:
      - lola-data:/app/data
      - ./data/openbao:/run/openbao:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      clamav:
        condition: service_started
      jaeger:
        condition: service_started
      seq:
        condition: service_started

  # Officer console (MPE-208) — BFF custody: OIDC_ISSUER/REDIRECT_URI are
  # browser-facing (localhost), TOKEN_URL is container-facing (api).
  web-officer:
    build: ./clients/web
    ports: ["3200:3200"]
    environment:
      PORT: "3200"
      API_URL: http://api:8200
      OIDC_ISSUER: http://localhost:8200
      OIDC_AUTHORIZE_URL: http://localhost:8200/connect/authorize
      OIDC_TOKEN_URL: http://api:8200/connect/token
      OIDC_CLIENT_ID: lola-officer-console
      OIDC_REDIRECT_URI: http://localhost:3200/callback
      SESSION_SECRET: dev-session-secret-not-for-prod
    depends_on:
      api:
        condition: service_healthy

  # web-borrower:               # M12 — Next.js borrower portal (:3300)

volumes:
  minio-data:
  lola-data:
  openbao-data:
